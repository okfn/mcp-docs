site_name: OKFN MCP Platform
site_description: >-
  Open documentation for the OKFN MCP platform: answering questions
  with open data, with full traceability.
site_url: https://okfn.github.io/mcp-docs/
repo_url: https://github.com/okfn/mcp-docs
repo_name: okfn/mcp-docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/images/lg-okfn.svg
  favicon: assets/images/favicon.ico
  icon:
    repo: fontawesome/brands/github
  # OKFN brand fonts (see docs/stylesheets/extra.css): okfn.org uses
  # HK Grotesk for text and Necto Mono for headings/code. Hanken Grotesk
  # is the same typeface's successor on Google Fonts; Space Mono is the
  # closest Google Fonts stand-in for Necto Mono (a commercial font).
  font:
    text: Hanken Grotesk
    code: Space Mono
  palette:
    # Light mode. "custom" defers all colors to stylesheets/extra.css,
    # where the OKFN palette (cyan/purple/black) is defined.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.integrate
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

# The header logo/title link to the TRAIL landing page instead of the
# docs home (Material's extra.homepage). The docs home stays reachable
# as "Home" in the sidebar nav.
extra:
  homepage: https://mcp.okfn.org/

extra_css:
  - stylesheets/extra.css

# Pin Mermaid to v10.
#
# Material loads Mermaid 11 from a CDN, but only if `window.mermaid` is not
# already defined, so loading v10 here takes precedence. We do this because
# Mermaid 11 renames the arrowhead marker to "<diagram-id>-arrowhead", which
# no longer matches the "#arrowhead path" selector in Material's stylesheet.
# Nothing then paints the arrowheads and they fall back to black, which is
# invisible in dark mode. Mermaid 10 keeps the plain "arrowhead" id.
#
# Remove this line once Material's stylesheet matches Mermaid 11's markers,
# and check that arrowheads are still visible in dark mode.
extra_javascript:
  - https://unpkg.com/mermaid@10/dist/mermaid.min.js

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: es
          name: Español
          build: true
          nav_translations:
            Home: Inicio
            Introduction: Introducción
            Project context: Contexto del proyecto
            Why MCP?: ¿Por qué MCP?
            Developer guide: Guía para desarrolladores
            Architecture & design principles: Arquitectura y principios de diseño
            System architecture: Arquitectura del sistema
            Architectural constraints: Restricciones de arquitectura
            Modular plugins: Plugins modulares
            Getting started: Primeros pasos
            Repositories: Repositorios
            Run the MCP server: Ejecutar el servidor MCP
            Test with MCP Inspector: Probar con MCP Inspector
            Run the chat gateway: Ejecutar el chat gateway
            Building plugins & datasets: Construir plugins y datasets
            Describe your plugin: Describir tu plugin
            YAML datasets: Datasets en YAML
            Python tools: Herramientas en Python
            Tool results: Resultados de las herramientas
            Connect to a server: Conectar a un servidor
            Domain glossaries: Glosarios de dominio
            Use cases: Casos de uso
            Uruguay implementation: Implementación de Uruguay
            Brazil implementation: Implementación de Brasil
            Operations: Operaciones
            Deployment: Despliegue
            Contributing: Contribuir
        - locale: pt
          name: Português
          build: true
          nav_translations:
            Home: Início
            Introduction: Introdução
            Project context: Contexto do projeto
            Why MCP?: Por que MCP?
            Developer guide: Guia do desenvolvedor
            Architecture & design principles: Arquitetura e princípios de design
            System architecture: Arquitetura do sistema
            Architectural constraints: Restrições de arquitetura
            Modular plugins: Plugins modulares
            Getting started: Primeiros passos
            Repositories: Repositórios
            Run the MCP server: Executar o servidor MCP
            Test with MCP Inspector: Testar com o MCP Inspector
            Run the chat gateway: Executar o chat gateway
            Building plugins & datasets: Construir plugins e datasets
            Describe your plugin: Descrever seu plugin
            YAML datasets: Datasets em YAML
            Python tools: Ferramentas em Python
            Tool results: Resultados das ferramentas
            Connect to a server: Conectar a um servidor
            Domain glossaries: Glossários de domínio
            Use cases: Casos de uso
            Uruguay implementation: Implementação do Uruguai
            Brazil implementation: Implementação do Brasil
            Operations: Operações
            Deployment: Implantação
            Contributing: Contribuir

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Introduction:
      - Project context: introduction/context.md
      - Why MCP?: introduction/why-mcp.md
  - Developer guide:
      - Architecture & design principles:
          - System architecture: dev/architecture.md
          - Architectural constraints: dev/constraints.md
          - Modular plugins: dev/design-pattern.md
      - Getting started:
          - getting-started/index.md
          - Repositories: dev/repositories.md
          - Run the MCP server: getting-started/mcp-server.md
          - Test with MCP Inspector: getting-started/inspector.md
          - Run the chat gateway: getting-started/chat-gateway.md
      - Building plugins & datasets:
          - plugins/index.md
          - Describe your plugin: plugins/plugin-info.md
          - YAML datasets: plugins/yaml-datasets.md
          - Python tools: plugins/python-tools.md
          - Tool results: plugins/tool-results.md
          - Connect to a server: plugins/connect.md
          - Domain glossaries: plugins/glossaries.md
  - Use cases:
      - catalogs/index.md
      - Uruguay implementation: catalogs/uruguay.md
      - Brazil implementation: catalogs/brasil.md
  - Operations:
      - operations/index.md
      - Deployment: operations/deployment.md
  - Contributing: contributing.md
